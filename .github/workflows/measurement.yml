name: Measurement collector

# Builds the measurement series the KPI framework reads: victims by month,
# group, country and sector. Separate from "Refresh intelligence data", which
# exists to fill the 13 group pages and throws everything else away.
#
# Scheduled at 06:00 UTC so it never collides with the group feed, which runs
# at 00:00, 08:00 and 16:00. The data source rate limits clients that ask too
# fast, so the two jobs deliberately stay out of each other's way.

on:
  schedule:
    - cron: '0 6 * * *'      # daily, 06:00 UTC
  workflow_dispatch:          # and on demand from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Re-pulls the current AND previous month every run. That is what makes
      # it self-healing: a job that fails for six weeks is repaired by the next
      # successful run, with nobody having to notice or intervene.
      - name: Collect victim measurement series
        run: python3 scripts/collect_measurement.py

      # Two free keyless sources, two requests. Measures how long after
      # disclosure a vulnerability is confirmed exploited.
      - name: Collect exploitation lag series
        if: always()
        run: python3 scripts/collect_exploits.py

      # Permission Layer nodes. Both keyless, both rated critical or high on the
      # ecosystem map, both previously measured by nothing.
      - name: Collect upstream transit carriers
        if: always()
        run: python3 scripts/collect_transit.py

      - name: Collect registry sponsors
        if: always()
        run: python3 scripts/collect_registry.py

      # Needs a free abuse.ch Auth-Key, supplied by the repository secret. The
      # key is passed in the environment and never written to any output file.
      - name: Collect crypter and packer usage
        if: always()
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 scripts/collect_crypters.py

      # Records the tags MalwareBazaar is actually applying right now, to a file
      # as well as the log. The seed tag list is a guess; this is how it gets
      # replaced with reality.
      - name: Record tags currently in use (for curation)
        if: always()
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 scripts/collect_crypters.py --discover || true

      # Joins tracked provider address space against live malware infrastructure.
      # Answers whether a provider is being USED, which every other bulletproof
      # hosting measurement here is blind to.
      - name: Collect live threat infrastructure
        if: always()
        run: python3 scripts/collect_hosted_threats.py

      # Watches the hand-maintained enforcement tracker for drift against the
      # published OFAC list. Produces questions for a person, never corrections.
      - name: Check sanctions tracker for drift
        if: always()
        run: |
          python3 scripts/check_sanctions.py --selftest
          python3 scripts/check_sanctions.py

      # The third and last Permission Layer node. Needs the free Companies House
      # REST API key from the repository secret; the key never reaches a file.
      - name: Collect corporate formation agents
        if: always()
        env:
          COMPANIES_HOUSE_KEY: ${{ secrets.COMPANIES_HOUSE_KEY }}
        run: python3 scripts/collect_formation.py

      # Tests the scored operations against later leak-site posting. Runs after
      # the victim series it depends on.
      - name: Check scoreboard against observed activity
        if: always()
        run: python3 scripts/check_scoreboard.py

      # Reads the crypto addresses OFAC publishes with its designations and asks
      # the public chains whether those wallets still move money. Keyless.
      - name: Collect sanctioned wallet activity
        if: always()
        run: python3 scripts/collect_wallets.py

      # Reports how old the hand-maintained evidence is. Dates, not inferences.
      - name: Check hand-maintained evidence for staleness
        if: always()
        run: python3 scripts/check_staleness.py

      # Runs LAST, on purpose. It reads what the collectors above actually
      # produced and works out each map node's verdict from that, so a broken
      # collector degrades its nodes instead of leaving a stale claim standing.
      - name: Build node coverage register
        if: always()
        run: python3 scripts/build_coverage.py

      - name: Show health reports
        if: always()
        run: |
          for f in victims exploits transit registry crypters threats formation sanctions scoreboard wallets staleness coverage; do
            echo "----- $f -----"
            cat "data/measurement/HEALTH-$f.txt" || echo "No $f health report."
            echo
          done

      - name: Commit the series
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/measurement/
          git diff --staged --quiet \
            || git commit -m "Measurement: victim series $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
