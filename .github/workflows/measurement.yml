name: Measurement collector

# Builds the measurement series the KPI framework reads: victims by month,
# group, country and sector. Separate from "Refresh intelligence data", which
# exists to fill the 13 group pages and throws everything else away.
#
# Scheduled at 06:00 UTC so it never collides with the group feed, which runs
# at 00:00, 08:00 and 16:00. The data source rate limits clients that ask too
# fast, so the two jobs deliberately stay out of each other's way.

on:
  schedule:
    - cron: '0 6 * * *'      # daily, 06:00 UTC
  workflow_dispatch:          # and on demand from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Re-pulls the current AND previous month every run. That is what makes
      # it self-healing: a job that fails for six weeks is repaired by the next
      # successful run, with nobody having to notice or intervene.
      - name: Collect victim measurement series
        run: python3 scripts/collect_measurement.py

      # Two free keyless sources, two requests. Measures how long after
      # disclosure a vulnerability is confirmed exploited.
      - name: Collect exploitation lag series
        if: always()
        run: python3 scripts/collect_exploits.py

      # Permission Layer nodes. Both keyless, both rated critical or high on the
      # ecosystem map, both previously measured by nothing.
      - name: Collect upstream transit carriers
        if: always()
        run: python3 scripts/collect_transit.py

      - name: Collect registry sponsors
        if: always()
        run: python3 scripts/collect_registry.py

      # Needs a free abuse.ch Auth-Key, supplied by the repository secret. The
      # key is passed in the environment and never written to any output file.
      - name: Collect crypter and packer usage
        if: always()
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 scripts/collect_crypters.py

      # Prints the tags MalwareBazaar is actually applying right now. The seed
      # tag list is a guess; this is how it gets replaced with reality. Read it
      # in the Actions log, then curate data/measurement/crypter-tags.json.
      - name: List tags currently in use (for curation)
        if: always()
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 scripts/collect_crypters.py --discover || true

      - name: Show health reports
        if: always()
        run: |
          for f in victims exploits transit registry crypters; do
            echo "----- $f -----"
            cat "data/measurement/HEALTH-$f.txt" || echo "No $f health report."
            echo
          done

      - name: Commit the series
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/measurement/
          git diff --staged --quiet \
            || git commit -m "Measurement: victim series $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
