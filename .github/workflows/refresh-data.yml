name: Refresh intelligence data

on:
  schedule:
    - cron: '0 */8 * * *'   # Every 8 hours: 00:00, 08:00, 16:00 UTC
  workflow_dispatch:          # Allow manual trigger from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write         # Needed to commit updated data files back to repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install feedparser requests

      # -------------------------------------------------------
      # ransomware.live victims for the 13 tracked group pages.
      #
      # The code lives in scripts/fetch_group_victims.py so it can be run and
      # tested locally. It used to be inline here, which is why a fault went
      # unnoticed: a failed month printed a warning, the run carried on, and
      # the group files were published with victims silently missing.
      #
      # That script now refuses to write anything unless all six months
      # downloaded. If this step goes red, the site keeps its previous, complete
      # files. A visible failure is better than a quiet under-count.
      # -------------------------------------------------------
      - name: Pull ransomware.live victim data by group
        run: python3 scripts/fetch_group_victims.py

      # -------------------------------------------------------
      # TI blog RSS feed parser - recent articles per group
      # -------------------------------------------------------
      - name: Parse TI blog RSS feeds
        run: python3 scripts/fetch_ti_feeds.py

      # -------------------------------------------------------
      # Timestamp file - tells the HTML when data was last refreshed
      # -------------------------------------------------------
      # fetch_group_victims.py writes groups/data/last-updated.json itself,
      # but only on a run where every month downloaded. Nothing to do here.

      # -------------------------------------------------------
      # Commit updated data files back to the repo
      # GitHub Pages will serve the new JSON within minutes
      # -------------------------------------------------------
      - name: Commit and push data updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add groups/data/
          git diff --staged --quiet \
            || git commit -m "Auto: data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
